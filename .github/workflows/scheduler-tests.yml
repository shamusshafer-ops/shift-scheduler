name: Scheduler rule and coverage tests

on:
  push:
    paths:
      - 'ShiftScheduler_latest loop.html'
      - 'load-core.js'
      - 'test-coverage.js'
      - 'test-staffing.js'
      - 'test-excel-export.js'
      - 'test-policy.js'
      - 'test-pto.js'
      - 'test-overtime.js'
      - 'test-availability.js'
      - 'test-completion.js'
      - 'test-publication.js'
      - 'test-locks-fairness.js'
      - 'test-integration-audit.js'
      - 'test-complete-search.js'
      - 'test-autofill-repair.js'
      - 'test-calloff.js'
      - 'test-shift-availability.js'
      - 'fixtures/complete-search-roster.json'
      - 'fixtures/autofill-real-roster-drafts.json'
      - '.github/workflows/scheduler-tests.yml'
  pull_request:
    paths:
      - 'ShiftScheduler_latest loop.html'
      - 'load-core.js'
      - 'test-coverage.js'
      - 'test-staffing.js'
      - 'test-excel-export.js'
      - 'test-policy.js'
      - 'test-pto.js'
      - 'test-overtime.js'
      - 'test-availability.js'
      - 'test-completion.js'
      - 'test-publication.js'
      - 'test-locks-fairness.js'
      - 'test-integration-audit.js'
      - 'test-complete-search.js'
      - 'test-autofill-repair.js'
      - 'test-calloff.js'
      - 'test-shift-availability.js'
      - 'fixtures/complete-search-roster.json'
      - 'fixtures/autofill-real-roster-drafts.json'
      - '.github/workflows/scheduler-tests.yml'

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test-coverage.js test-staffing.js test-excel-export.js test-policy.js test-pto.js test-overtime.js test-availability.js test-completion.js test-publication.js test-locks-fairness.js test-integration-audit.js test-complete-search.js test-autofill-repair.js test-calloff.js test-shift-availability.js
